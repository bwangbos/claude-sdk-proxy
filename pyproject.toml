[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quaylet"
version = "0.0.0"
description = "Local API gateway for Claude and ChatGPT subscriptions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "claude-agent-sdk==0.2.152",
    "httpx>=0.28,<1",
    "jsonschema==4.26.0",
    "mcp==2.1.1",
    "referencing==0.37.0",
    "starlette>=1.6,<2",
    "uvicorn>=0.52,<1",
]

[project.urls]
Repository = "https://github.com/bwangbos/quaylet"
Issues = "https://github.com/bwangbos/quaylet/issues"

[project.scripts]
quaylet = "quaylet.cli:main"
quaylet-capabilities = "quaylet.capability_cli:main"
quaylet-probe = "quaylet.probe_cli:main"

[dependency-groups]
dev = [
    "anthropic>=0.75,<1",
    "mypy>=1.18,<2",
    "openai>=2.14,<3",
    "pytest>=8.4,<10",
    "pytest-anyio>=0.0.0",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
markers = [
    "anyio: asynchronous test executed by the single asyncio backend",
    "live: explicit opt-in test requiring the documented provider login",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/quaylet"]
